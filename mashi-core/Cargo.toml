[package]
name = "mashi-core"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std", "log/max_level_debug", "log/release_max_level_warn"]
std = ["wasmparser"]
tiny = ["log/max_level_off"]

[dependencies]
log = "0.4.29"
wasmparser = { version = "0.244.0", optional = true }

[dev-dependencies]
anyhow = { workspace = true }
wasmi = "1.0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
lol_alloc = "0.4.1"
