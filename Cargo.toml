[workspace]
members = ["mashi-core", "mashi-test-suite"]
resolver = "3"

[workspace.package]
authors = ["sagacity", "ferris"]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.dev.package.mashi-core]
# Enable the following to make the test suite run faster, at the expense of debuggability
opt-level = 3

[profile.dev.package.wast]
opt-level = 3
